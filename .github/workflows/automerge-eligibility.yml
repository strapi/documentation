name: 'Auto-merge: check eligibility'

# Decides whether a self-healing documentation PR is constrained enough to merge
# without review, and records the answer as the `automerge: eligible` label.
#
# This workflow judges FORM ONLY — which files, how many lines, what shape. It
# never judges content. Whether a change should exist at all stays with the
# maintainer, and the Slack message this posts is how they exercise that
# judgment: one line, 24 hours before the merge, stoppable with a label.
#
# It does not merge anything. `automerge-cron.yml` does that, and only for PRs
# carrying the label this workflow sets.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to evaluate'
        required: true
        type: string
      skip_quiet_period:
        description: 'Skip the quiet period (manual runs are already deliberate)'
        required: false
        type: boolean
        default: true

# One run per PR. A push during the quiet period cancels the pending run and
# starts a fresh one, which is what makes the debounce below work.
concurrency:
  group: automerge-eligibility-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  ELIGIBLE_LABEL: 'automerge: eligible'
  # The maintainer's override. The mechanical checks judge form, and form is a
  # proxy: a change can violate a criterion and still be right. When that
  # happens, this label records that a human read the PR and vouched for it.
  #
  # It is the positive counterpart of `flag: don't merge`, and it is deliberately
  # a label rather than a relaxed criterion — the decision stays visible on the
  # PR, attributable, and reversible by removing it.
  #
  # It overrides FORM ONLY. The quarantine, the required checks and the absence
  # period still apply, and `flag: don't merge` / `flag: merge pending release`
  # still block the merge through block-labeled-prs.yml.
  APPROVED_LABEL: 'automerge: approved by piwi'
  SCOPE_LABEL: auto-doc-healing
  QUIET_PERIOD_MINUTES: 5
  # Only used to tell the maintainer when the merge will happen. The cron owns
  # the actual quarantine; this copy must be kept in step with the value in
  # automerge-cron.yml, or the announced date drifts from the real one.
  QUARANTINE_HOURS: 24

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
      - name: Check scope
        id: scope
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN_PIWI }}
          PR: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          set -euo pipefail

          # Only pipeline output is in scope. Community and contributor PRs are
          # reviewed by a human, permanently — that is not a limitation of the
          # gate, it is a decision about what should stay human.
          LABELS=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name] | join("\n")')

          if ! echo "$LABELS" | grep -Fxq "$SCOPE_LABEL"; then
            echo "PR #$PR does not carry '$SCOPE_LABEL' — out of scope"
            echo "in_scope=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A maintainer-approved PR is not re-judged. Without this, adding the
          # approval label triggers this workflow through the `labeled` event,
          # the checks fail again on the very criterion being overridden, and the
          # "Update the eligibility label" step removes `automerge: eligible` —
          # silently undoing the decision minutes after it was made.
          if echo "$LABELS" | grep -Fxq "$APPROVED_LABEL"; then
            echo "PR #$PR carries '$APPROVED_LABEL' — form checks skipped"
            echo "in_scope=false" >> "$GITHUB_OUTPUT"
            echo "approved=true" >> "$GITHUB_OUTPUT"
            {
              echo "## Auto-merge eligibility — #$PR"
              echo ""
              echo "**Approved by the maintainer — mechanical checks skipped.**"
              echo ""
              echo "This PR carries \`$APPROVED_LABEL\`, so its form is not judged:"
              echo "a human read it and vouched for it."
              echo ""
              echo "The quarantine, the required CI checks and the absence period"
              echo "still apply. To stop the merge, remove that label or add"
              echo "\`flag: don't merge\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "in_scope=true" >> "$GITHUB_OUTPUT"
          echo "approved=false" >> "$GITHUB_OUTPUT"

      # Wait for the PR to stop moving. Combined with cancel-in-progress, a push
      # during this window kills the run and restarts the clock, so the checks
      # only run once the PR has been quiet for the full period. Without it,
      # every commit in a burst would trigger a full evaluation.
      #
      # Skipped by default on manual runs: someone who typed a PR number is not
      # mid-burst, and waiting five minutes to see a result is just friction.
      - name: Wait for the quiet period
        if: |
          steps.scope.outputs.in_scope == 'true' &&
          !(github.event_name == 'workflow_dispatch' && inputs.skip_quiet_period)
        run: sleep $(( QUIET_PERIOD_MINUTES * 60 ))

      - name: Checkout the check scripts
        if: steps.scope.outputs.in_scope == 'true'
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
          fetch-depth: 1
          filter: blob:none

      - name: Run the eligibility checks
        if: steps.scope.outputs.in_scope == 'true'
        id: checks
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN_PIWI }}
          AUTOMERGE_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || inputs.pr_number }}
        # A check exiting 1 is this step's normal output — it means a criterion
        # was violated — so the shell must not treat it as a fatal error.
        #
        # `shell: bash {0}` is required, not `shell: bash`. The latter expands to
        # `bash --noprofile --norc -e -o pipefail {0}`, which still carries -e:
        # the run on 2026-08-26 stopped after 3 of 12 checks with that setting.
        # Only the explicit `{0}` form drops it.
        shell: bash {0}
        run: |
          set -uo pipefail

          DIR=".github/scripts/automerge"
          chmod +x "$DIR"/*.sh

          # Criterion 8 needs a yarn install and a full build to regenerate the
          # llms files. It is only worth paying for when the PR actually touches
          # them, and the script reports exit 2 ("cannot tell") when asked to
          # verify without regenerating — which is correctly treated as blocking.
          CHECKS=(
            check-paths
            check-single-file
            check-file-exists
            check-line-count
            check-no-headings
            check-no-admonitions
            check-code-blocks
            check-llms-consistency
            check-no-frontmatter-change
            check-no-external-links
            check-no-content-removal
            check-no-component-change
          )

          VIOLATED=""
          UNKNOWN=""

          # Context first, so the report stands on its own: which PR, which page,
          # how big. Reading the run should not require opening the PR.
          META=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" \
            --json title,url,additions,deletions,files,body 2>/dev/null || echo '{}')
          TITLE=$(echo "$META" | jq -r '.title // "?"')
          URL=$(echo "$META" | jq -r '.url // ""')
          ADD=$(echo "$META" | jq -r '.additions // 0')
          DEL=$(echo "$META" | jq -r '.deletions // 0')
          PAGE=$(echo "$META" | jq -r '[.files[]?.path | select(test("llms.*\\.txt$") | not)] | .[0] // "?"')
          SOURCE=$(echo "$META" | jq -r '.body // ""' \
            | grep -oE 'strapi/strapi/pull/[0-9]+' | head -1 | grep -oE '[0-9]+$' || true)

          {
            echo "## Auto-merge eligibility — [#$PR]($URL)"
            echo ""
            echo "**$TITLE**"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Page | \`$PAGE\` |"
            echo "| Size | +$ADD / −$DEL |"
            if [ -n "$SOURCE" ]; then
              echo "| Corresponding Strapi CMS PR | [strapi/strapi#$SOURCE](https://github.com/strapi/strapi/pull/$SOURCE) |"
            fi
            echo ""
            echo "### Checks"
            echo ""
            echo "| Check | Result | Detail |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          for CHECK in "${CHECKS[@]}"; do
            OUT=$("$DIR/$CHECK.sh" "$PR" 2>&1)
            CODE=$?
            DETAIL=$(echo "$OUT" | head -1 | sed -E 's/^(PASS|FAIL|UNKNOWN): //' | cut -c1-90)

            case "$CODE" in
              0) ICON="✅" ;;
              1) ICON="❌"; VIOLATED="${VIOLATED}${CHECK#check-}, " ;;
              *) ICON="⚠️"; UNKNOWN="${UNKNOWN}${CHECK#check-}, " ;;
            esac

            echo "| \`${CHECK#check-}\` | $ICON | $DETAIL |" >> "$GITHUB_STEP_SUMMARY"
            printf '%s %-28s %s\n' "$ICON" "${CHECK#check-}" "$DETAIL"
          done

          echo "" >> "$GITHUB_STEP_SUMMARY"

          # A check that could not run is not a pass. Both states block, but they
          # are reported separately so a broken check is never mistaken for a
          # violated criterion.
          # The verdict says what happens next, not just whether checks passed.
          # Someone reading this run should not have to know the design to know
          # what to expect.
          if [ -n "$VIOLATED" ] || [ -n "$UNKNOWN" ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Verdict"
              echo ""
              echo "**Not eligible — this PR needs a human review.**"
              echo ""
              [ -n "$VIOLATED" ] && echo "- Criteria violated: \`${VIOLATED%, }\`"
              [ -n "$UNKNOWN" ] && echo "- Could not be evaluated: \`${UNKNOWN%, }\` (treated as blocking)"
              echo ""
              echo "The \`$ELIGIBLE_LABEL\` label is not applied, or is removed if it was there."
              echo ""
              echo "These criteria judge form, not content. If you have read this PR"
              echo "and it is fine as it stands, add \`$APPROVED_LABEL\`: the checks"
              echo "are then skipped and the cron merges it after the usual"
              echo "quarantine. Adding \`$ELIGIBLE_LABEL\` by hand does not work —"
              echo "this workflow re-runs and removes it."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "eligible=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Verdict"
              echo ""
              echo "**Eligible — all $((${#CHECKS[@]})) checks passed.**"
              echo ""
              echo "The \`$ELIGIBLE_LABEL\` label is applied. This PR will be merged"
              echo "by the auto-merge cron once it is 24 hours old and its required"
              echo "checks are green."
              echo ""
              echo "To stop it, add the \`flag: don't merge\` label."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # The step's exit code is that of its last command, and the last one to
          # run above is `[ -n "$UNKNOWN" ]`. When no check errored — the normal
          # case — that test is false and returns 1, failing the step even though
          # every check ran and the verdict was recorded.
          #
          # This step reports a verdict; it does not pass or fail on it. Whether
          # the PR is eligible is carried by the `eligible` output.
          exit 0

      - name: Update the eligibility label
        if: steps.scope.outputs.in_scope == 'true'
        id: label
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN_PIWI }}
          PR: ${{ github.event.pull_request.number || inputs.pr_number }}
          ELIGIBLE: ${{ steps.checks.outputs.eligible }}
        shell: bash {0}
        run: |
          set -uo pipefail

          # The label always reflects the most recent evaluation. That is what
          # lets the cron stay simple: it trusts the label for form and only
          # re-checks time and CI state.
          # `gh pr view --jq` takes a single expression and no --arg: passing one
          # fails with "accepts at most 1 arg(s), received 4", HAS_LABEL comes
          # back empty, and the removal branch below can never be reached — a PR
          # that stopped being eligible would keep its label and still merge.
          # Listing the names and matching with grep sidesteps the limitation.
          if gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels \
            --jq '.labels[].name' | grep -Fxq "$ELIGIBLE_LABEL"; then
            HAS_LABEL=true
          else
            HAS_LABEL=false
          fi

          ENCODED=$(jq -rn --arg l "$ELIGIBLE_LABEL" '$l|@uri')

          # REST rather than `gh pr edit`: the latter goes through GraphQL and
          # demands the read:org scope, which PAT_TOKEN_PIWI does not carry.
          if [ "$ELIGIBLE" = "true" ] && [ "$HAS_LABEL" != "true" ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR/labels" \
              -f "labels[]=$ELIGIBLE_LABEL" --silent
            echo "Added '$ELIGIBLE_LABEL'"
            echo "- Label **added**: \`$ELIGIBLE_LABEL\`" >> "$GITHUB_STEP_SUMMARY"
            echo "newly_eligible=true" >> "$GITHUB_OUTPUT"

          elif [ "$ELIGIBLE" != "true" ] && [ "$HAS_LABEL" = "true" ]; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/issues/$PR/labels/$ENCODED" --silent
            echo "Removed '$ELIGIBLE_LABEL'"
            echo "- Label **removed**: \`$ELIGIBLE_LABEL\` (the PR is no longer eligible)" >> "$GITHUB_STEP_SUMMARY"
            echo "newly_eligible=false" >> "$GITHUB_OUTPUT"

          else
            echo "Label already correct, nothing to do"
            echo "- Label unchanged (already correct)" >> "$GITHUB_STEP_SUMMARY"
            echo "newly_eligible=false" >> "$GITHUB_OUTPUT"
          fi

          exit 0

      # The veto window. Posted once, when a PR first becomes eligible, roughly
      # 24 hours before the cron merges it.
      #
      # The backtest is the reason this exists: of 14 PRs that needed the
      # maintainer, 5 pass every mechanical check. Four were wording touch-ups;
      # one (#3080) was a real miss whose diff was flawless. No criterion made of
      # paths, counts and regexes reaches that — but a human reading one line can.
      # Not posted on manual runs: those are tests or re-evaluations, and a veto
      # line for a PR the maintainer is already looking at is noise. The label is
      # still set, so the cron behaves identically either way.
      - name: Post the veto window to Slack
        if: steps.label.outputs.newly_eligible == 'true' && github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN_PIWI }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_DOCUMENTATION_OPS_CHANNEL_ID }}
          PR: ${{ github.event.pull_request.number || inputs.pr_number }}
        shell: bash {0}
        run: |
          set -uo pipefail

          if [ -z "$SLACK_BOT_TOKEN" ] || [ -z "$SLACK_CHANNEL" ]; then
            echo "Slack not configured, skipping notification"
            exit 0
          fi

          META=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" \
            --json title,url,additions,deletions,files,body)

          TITLE=$(echo "$META" | jq -r '.title')
          URL=$(echo "$META" | jq -r '.url')
          ADD=$(echo "$META" | jq -r '.additions')
          DEL=$(echo "$META" | jq -r '.deletions')
          PAGE=$(echo "$META" | jq -r '[.files[].path | select(test("llms.*\\.txt$") | not)] | .[0] // "?"' \
            | sed 's|^docusaurus/docs/||')
          SOURCE=$(echo "$META" | jq -r '.body' | grep -oE 'strapi/strapi/pull/[0-9]+' | head -1 | grep -oE '[0-9]+$' || true)

          SHORT_TITLE=$(printf '%s' "$TITLE" | cut -c1-70)
          if [ "${#TITLE}" -gt 70 ]; then SHORT_TITLE="${SHORT_TITLE}…"; fi

          # Slack link syntax is <url|text>, not Markdown.
          LINE="<${URL}|#${PR} — ${SHORT_TITLE}>"
          CONTEXT="${PAGE} · +${ADD}/−${DEL}"

          # The upstream PR gets its own labelled line rather than a third item
          # in the context line: "Corresponding Strapi CMS PR" is too long to sit
          # between the page path and the diff size, and the label is what makes
          # the link readable without opening it.
          SOURCE_LINE=""
          [ -n "$SOURCE" ] && SOURCE_LINE="\nCorresponding Strapi CMS PR: <https://github.com/strapi/strapi/pull/${SOURCE}|strapi/strapi#${SOURCE}>"

          # The first cron run that merges this PR, named rather than guessed.
          # "tomorrow" was wrong whenever the run happened before the 24h
          # quarantine expired: a PR opened at 07:00 UTC is still 1h too young at
          # the 08:00 run the next day, so it only goes in the day after. The
          # cron is daily at 08:00 UTC, so the first eligible run is the first
          # 08:00 that falls at least QUARANTINE_HOURS after the PR was opened.
          MERGE_AT=$(date -u -d "+$QUARANTINE_HOURS hours" '+%Y-%m-%dT%H:%M:%SZ')
          MERGE_DAY=$(date -u -d "$MERGE_AT" '+%Y-%m-%d')
          # Compared as HHMM against the 08:00 run, so 08:00:00 exactly counts as
          # ripe in time for that run rather than being pushed to the next day.
          MERGE_HHMM=$(date -u -d "$MERGE_AT" '+%H%M')

          # Ripe only after that day's run has already gone by, so it waits for
          # the next one.
          if [ "$((10#$MERGE_HHMM))" -gt 800 ]; then
            MERGE_DAY=$(date -u -d "$MERGE_DAY +1 day" '+%Y-%m-%d')
          fi

          WHEN=$(date -u -d "$MERGE_DAY" '+%A %-d %B')

          TEXT=$(printf ':hourglass_flowing_sand: *Will auto-merge on %s* (08:00 UTC)\n%s\n%s%b\n\nStop it by adding the `flag: don'\''t merge` label.' \
            "$WHEN" "$LINE" "$CONTEXT" "$SOURCE_LINE")

          curl -s -X POST "https://slack.com/api/chat.postMessage" \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-type: application/json; charset=utf-8" \
            -d "$(jq -n --arg channel "$SLACK_CHANNEL" --arg text "$TEXT" '{channel: $channel, text: $text}')" \
            > /dev/null || echo "Slack notification failed (non-blocking)"

          exit 0
