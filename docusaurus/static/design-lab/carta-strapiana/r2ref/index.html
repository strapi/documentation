<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carta Strapiana</title>
<link rel="stylesheet" href="deadreckoning.css">
</head>
<body>
<div id="stage">
  <canvas id="sea" width="1440" height="900"></canvas>
  <div id="plate-title" aria-hidden="true">
    <span class="pt-main">CARTA STRAPIANA</span>
    <span class="pt-sub">Gate-0 : the helm and the sea</span>
  </div>
  <div id="hints" aria-hidden="true">
    Drag the wheel or press &#8592;/&#8594; to give the helm an order.<br>
    F full sail &middot; H half sail &middot; R heave to &middot; hold SPACE for the spyglass &middot; D dusk.
  </div>
  <div id="caption" aria-live="polite"></div>
  <div id="loading">Laying the plates&hellip;</div>
</div>
<script src="deadreckoning.js"></script>
</body>
</html>
