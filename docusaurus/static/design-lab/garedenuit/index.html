<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Gare de Nuit</title>
<meta name="description" content="La documentation Strapi comme une gare de trains de nuit : 290 départs, 18 voies, 77 mains.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="gare.css">
</head>
<body>
<div id="mist" aria-hidden="true"></div>

<header id="topbar">
  <a class="brand" href="#/gare" aria-label="Grand hall — tableau des départs">
    <span class="brand-enamel">LA GARE DE NUIT</span>
    <span class="brand-sub">documentation Strapi &middot; service de nuit</span>
  </a>
  <nav class="topnav" aria-label="Vues de la gare">
    <a href="#/gare" data-route="gare">Départs</a>
    <a href="#/quais" data-route="quais">Quais</a>
    <a href="#/legende" data-route="legende">Légende</a>
  </nav>
  <div class="clockbox" aria-hidden="true">
    <svg id="clock" viewBox="0 0 60 60" width="46" height="46">
      <circle cx="30" cy="30" r="28" class="clock-face"/>
      <circle cx="30" cy="30" r="28" class="clock-rim"/>
      <g class="clock-ticks" id="clock-ticks"></g>
      <line id="hand-h" x1="30" y1="30" x2="30" y2="17" class="hand hour"/>
      <line id="hand-m" x1="30" y1="30" x2="30" y2="10" class="hand min"/>
      <circle cx="30" cy="30" r="2" class="clock-hub"/>
    </svg>
    <span id="clock-digits">--:--</span>
  </div>
  <div class="searchbox">
    <input id="search" type="search" placeholder="Chercher une destination…" autocomplete="off"
           aria-label="Chercher une page parmi les 290 destinations">
    <div id="search-results" role="listbox" hidden></div>
  </div>
</header>

<main id="app">
  <section class="boot" aria-live="polite">
    <div class="boot-sign">LE TABLEAU S'ALLUME…</div>
    <div class="boot-sub">la gare charge ses 290 départs</div>
  </section>
</main>

<footer id="stationfoot">
  <span id="foot-facts"></span>
</footer>

<script src="gare.js"></script>
</body>
</html>
