<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TÉLÉ·ACHAT DOC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Oswald:wght@500;700&family=Archivo:ital,wght@0,400;0,600;0,800;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="f1.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <a class="logo" href="#/cms/intro" aria-label="Accueil TÉLÉ·ACHAT DOC">
      <span class="logo-tv">TÉLÉ·ACHAT</span><span class="logo-doc">DOC</span>
    </a>
    <span class="live-badge"><span class="live-dot" aria-hidden="true"></span>EN DIRECT</span>
    <span id="clock" class="clock" aria-label="heure"></span>
    <div class="standard">
      <label class="standard-label" for="search">☎ STANDARD</label>
      <input id="search" type="search" autocomplete="off" spellcheck="false"
             placeholder="Nos 290 conseillères vous écoutent…" aria-label="Rechercher un produit dans le catalogue">
      <div id="search-results" class="search-results" hidden></div>
    </div>
    <button id="notice-btn" class="notice-btn" type="button">LA NOTICE</button>
  </header>

  <div id="frame">
    <nav id="programme" aria-label="Programme des émissions">
      <div class="prog-head">LE PROGRAMME</div>
      <div id="prog-body"></div>
    </nav>
    <main id="stage">
      <div id="mire" class="mire" aria-hidden="true">
        <div class="mire-bars"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <p class="mire-text">UN INSTANT, NOUS RÉGLONS L'ANTENNE…</p>
      </div>
    </main>
  </div>

  <div id="chyron" aria-hidden="true">
    <div class="chyron-call"><span class="blink">APPELEZ&nbsp;MAINTENANT</span><span class="chyron-num">36&nbsp;15&nbsp;DOC</span></div>
    <div class="chyron-ticker"><div id="ticker-inner" class="ticker-inner"></div></div>
  </div>

  <div id="notice-modal" class="notice-modal" hidden>
    <div class="notice-card" role="dialog" aria-modal="true" aria-labelledby="notice-title">
      <button id="notice-close" class="notice-close" type="button" aria-label="Fermer la notice">✕</button>
      <h2 id="notice-title">La notice <small>(les vrais mots, sans le paillettes)</small></h2>
      <div id="notice-body"></div>
    </div>
  </div>
</div>
<script src="f1.js"></script>
</body>
</html>
