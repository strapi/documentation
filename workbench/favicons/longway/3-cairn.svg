<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges" role="img" aria-label="The Long Way Through, a memory cairn">
  <rect width="32" height="32" fill="#2E1A47"/>
  <rect x="0" y="24" width="32" height="8" fill="#1C0F2E"/>
  <!-- four flat stones on the dated kerb, widest at the foot -->
  <rect x="4"  y="24" width="24" height="3" fill="#FFF3E0" opacity="0.30"/>
  <rect x="7"  y="19" width="18" height="5" fill="#FFF3E0"/>
  <rect x="9"  y="14" width="14" height="4" fill="#FFF3E0"/>
  <rect x="11" y="10" width="10" height="3" fill="#FFF3E0"/>
  <rect x="13" y="6"  width="6"  height="3" fill="#FFA26B"/>
</svg>
